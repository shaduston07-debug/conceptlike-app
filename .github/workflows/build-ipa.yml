name: Build iPad IPA

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build web app
        run: |
          npm ci
          npm run build
          rm -rf ios/web
          cp -R dist ios/web

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild \
            -project Inkfinity.xcodeproj \
            -scheme Inkfinity \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*Swift|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Inkfinity.app || (tail -80 build.log && exit 1)

      - name: Package IPA
        run: |
          cd ios
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Inkfinity.app Payload/
          zip -qry ../Inkfinity.ipa Payload
          ls -la ../Inkfinity.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Inkfinity-ipa
          path: Inkfinity.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Inkfinity build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: Inkfinity.ipa
          body: |
            Unsigned iPad build of Inkfinity from `${{ github.ref_name }}` (${{ github.sha }}).
            Install with Sideloadly or AltStore (they sign it with your Apple ID).
